# Vault batches (OBBRN, table owner OBTRANSACTION).

order: 20
queries:

  - id: open_vault_batch_count
    title: Open Vault Batches
    page: dashboard
    group: Open Batches
    schema: obbrn
    type: read
    display: count
    sql: |
      SELECT COUNT(*)
      FROM {{obbrn:SRV_TB_BC_VAULT_BATCH}}
      WHERE vault_status = 'O'

  - id: open_vault_batches
    title: Open Vault Batches
    description: Leave the date empty to see all open vault batches.
    page: dashboard
    group: Vault Batch
    schema: obbrn
    type: read
    params:
      - { name: branch_date, label: "Branch date", type: date, required: false }
    sql: |
      SELECT *
      FROM {{obbrn:SRV_TB_BC_VAULT_BATCH}}
      WHERE vault_status = 'O'
        AND (:branch_date IS NULL OR TRUNC(branch_date) = :branch_date)
      ORDER BY branch_code, branch_date DESC

  - id: vault_batches_by_branch
    title: Vault Batches for a Branch
    page: dashboard
    group: Vault Batch
    schema: obbrn
    type: read
    params:
      - { name: branch_code, label: "Branch code", required: true, placeholder: "e.g. 005" }
    sql: |
      SELECT *
      FROM {{obbrn:SRV_TB_BC_VAULT_BATCH}}
      WHERE branch_code = :branch_code
      ORDER BY branch_date DESC
