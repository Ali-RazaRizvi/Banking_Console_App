# Branch batches (OBBRN, table owner OBTRANSACTION).
# {{obbrn:TABLE}} becomes OBTRANSACTION.TABLE, or OBTRANSACTION.TABLE@<DB link>
# when OBBRN is reached through the FLEXCUBE connection.

order: 10
queries:

  - id: open_branch_batch_count
    title: Open Branch Batches
    page: dashboard
    group: Open Batches
    schema: obbrn
    type: read
    display: count
    sql: |
      SELECT COUNT(*)
      FROM {{obbrn:SRV_TB_BC_BRANCH_BATCH}}
      WHERE branch_status = 'O'

  - id: open_branch_batches
    title: Open Branch Batches
    description: Leave the date empty to see all open branch batches.
    page: dashboard
    group: Branch Batch
    schema: obbrn
    type: read
    params:
      - { name: branch_date, label: "Branch date", type: date, required: false }
    sql: |
      SELECT *
      FROM {{obbrn:SRV_TB_BC_BRANCH_BATCH}}
      WHERE branch_status = 'O'
        AND (:branch_date IS NULL OR TRUNC(branch_date) = :branch_date)
      ORDER BY branch_code, branch_date DESC

  - id: branch_batches_by_branch
    title: Branch Batches for a Branch
    page: dashboard
    group: Branch Batch
    schema: obbrn
    type: read
    params:
      - { name: branch_code, label: "Branch code", required: true, placeholder: "e.g. 005" }
    sql: |
      SELECT *
      FROM {{obbrn:SRV_TB_BC_BRANCH_BATCH}}
      WHERE branch_code = :branch_code
      ORDER BY branch_date DESC
